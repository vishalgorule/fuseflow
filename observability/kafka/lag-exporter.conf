# Kafka Lag Exporter Configuration (seglo/kafka-lag-exporter 0.7.0)
# Exports consumer-group lag per (group, topic, partition) as Prometheus metrics on port 9308:
#   kafka_consumergroup_group_lag, kafka_consumergroup_group_offset, ...
# Mounted into the container at /opt/docker/conf/application.conf.

kafka-lag-exporter {
  reporters {
    prometheus {
      port = 9308
    }
  }

  poll-interval = 30 seconds
  lookup-table.memory.size = 60
  kafka-client-timeout = 10 seconds

  clusters = [
    {
      name = "fuseflow"
      bootstrap-brokers = "kafka:29092"
      # All groups and topics — the engine's consumers (fuseflow-engine, pool groups,
      # worker groups) and the dead-letter inspector are all of interest.
      group-whitelist = [".*"]
      topic-whitelist = [".*"]
    }
  ]
}
