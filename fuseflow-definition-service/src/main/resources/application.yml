spring:
  application:
    name: fuseflow-definition-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fuseflow?currentSchema=definition}
    username: ${SPRING_DATASOURCE_USERNAME:fuseflow}
    password: ${SPRING_DATASOURCE_PASSWORD:fuseflow}

  flyway:
    enabled: true
    create-schemas: true
    schemas: definition
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.75,0.95,0.99
  # HikariCP metrics: expose connection pool health via Micrometer
  metrics.tags.application: fuseflow-definition-service

# Phase 9: OpenTelemetry tracing
otel:
  service:
    name: fuseflow-definition-service
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}

# Phase 9: Structured JSON logging with correlation IDs
logging:
  level:
    io.fuseflow: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - correlationId=%X{correlationId} - %msg%n"
