spring:
  application:
    name: fuseflow-workflow-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fuseflow?currentSchema=engine}
    username: ${SPRING_DATASOURCE_USERNAME:fuseflow}
    password: ${SPRING_DATASOURCE_PASSWORD:fuseflow}

  flyway:
    enabled: true
    create-schemas: true
    schemas: engine
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Bound how long a send can block on broker metadata before failing fast.
        max.block.ms: 5000
    consumer:
      group-id: fuseflow-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Phase 5 engine HA: ≥ number of engine instances so every instance can hold partitions.
      # activity-results must have ≥ that many partitions (FUSEFLOW_KAFKA_TOPICS_PARTITIONS).
      concurrency: ${FUSEFLOW_ENGINE_LISTENER_CONCURRENCY:1}

  task:
    scheduling:
      pool:
        # Phase 7 scale: dedicated scheduler threads so the retry poller, the timeout poller
        # and the routing self-heal poller never block each other (Spring's default is a single
        # thread shared by all @Scheduled).
        size: ${FUSEFLOW_ENGINE_SCHEDULER_POOL:3}

  jackson:
    default-property-inclusion: non_null

# Phase 5 (default): Kafka transport with pool-based routing — the engine publishes each task
# to exactly one pool topic (fuseflow-pool.<poolName>) and consumes results from activity-results.
fuseflow:
  engine:
    # kafka (default) | in-memory. In-memory keeps the Phase 2 demo auto-completer for tests and
    # for running a workflow to completion without any worker or broker.
    dispatch-mode: ${FUSEFLOW_ENGINE_DISPATCH_MODE:kafka}
    # Phase 5 engine HA: fixed shard count (identical on every instance) + the shards this
    # instance boot-recovers (all | 0-3 | 0,1,4). Split shards across instances for HA.
    shards: ${FUSEFLOW_ENGINE_SHARDS:8}
    owned-shards: ${FUSEFLOW_ENGINE_OWNED_SHARDS:all}
    worker-events-group: ${FUSEFLOW_ENGINE_WORKER_EVENTS_GROUP:fuseflow-engine-events}
    # Phase 7 reliability defaults (FR-6/FR-7) — the engine-side fallback when neither the
    # task nor the workflow definition specifies a knob (resolution: task -> workflow -> here).
    retry:
      default-max-attempts: ${FUSEFLOW_ENGINE_RETRY_MAX_ATTEMPTS:3}
      default-fixed-delay: ${FUSEFLOW_ENGINE_RETRY_FIXED_DELAY:5s}
      default-exponential-backoff: ${FUSEFLOW_ENGINE_RETRY_EXPONENTIAL_BACKOFF:true}
      default-backoff-multiplier: ${FUSEFLOW_ENGINE_RETRY_BACKOFF_MULTIPLIER:2.0}
      # Exception class names that must never be retried (exact match or trailing '*').
      default-non-retryable-exceptions: []
    timeout:
      # SCHEDULED -> STARTED window (unroutable tasks / dispatches nobody picked up).
      start: ${FUSEFLOW_ENGINE_TIMEOUT_START:60s}
      # STARTED -> result window (hung/dead workers; the registry's heartbeat detection
      # already routes their pool OFFLINE, so the retry lands on a live worker).
      execution: ${FUSEFLOW_ENGINE_TIMEOUT_EXECUTION:300s}
    # Cadence of the retry + timeout poller (DB-polled due-time queue).
    poll-interval: ${FUSEFLOW_ENGINE_POLL_INTERVAL:5s}
    # Max due retries claimed per poll cycle — a burst drains across cycles, oldest first.
    poll-batch-size: ${FUSEFLOW_ENGINE_POLL_BATCH_SIZE:500}
    # Self-healing routing: re-seed the pool routing table from the registry on this cadence
    # even without worker-events, so a missed event can never leave routing stale.
    routing:
      refresh-interval: ${FUSEFLOW_ENGINE_ROUTING_REFRESH_INTERVAL:30s}
    # Partition ceiling per pool topic (min(declared concurrency, cap)).
    pool-topic:
      partition-cap: ${FUSEFLOW_ENGINE_POOL_PARTITION_CAP:16}
  registry:
    base-url: ${FUSEFLOW_REGISTRY_URL:http://localhost:8083}
  kafka:
    topic:
      activity-results: activity-results
      workflow-events: workflow-events
      worker-events: worker-events
      dead-letter: dead-letter
      pool-prefix: fuseflow-pool
    topics:
      partitions: 1
      replicas: 1
  demo:
    activity-delay-ms: 60000

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
