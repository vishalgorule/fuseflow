spring:
  application:
    name: fuseflow-workflow-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fuseflow?currentSchema=engine}
    username: ${SPRING_DATASOURCE_USERNAME:fuseflow}
    password: ${SPRING_DATASOURCE_PASSWORD:fuseflow}

  flyway:
    enabled: true
    create-schemas: true
    schemas: engine
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # Bound how long a send can block on broker metadata before failing fast.
        max.block.ms: 5000
    consumer:
      group-id: fuseflow-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jackson:
    default-property-inclusion: non_null

# Phase 4 (default): Kafka transport — the engine publishes activity tasks to activity-dispatch
# and consumes results from activity-results; SDK workers execute the activities.
fuseflow:
  engine:
    # kafka (default) | in-memory. In-memory keeps the Phase 2 demo auto-completer for tests and
    # for running a workflow to completion without any worker or broker.
    dispatch-mode: ${FUSEFLOW_ENGINE_DISPATCH_MODE:kafka}
  kafka:
    topic:
      activity-dispatch: activity-dispatch
      activity-results: activity-results
      workflow-events: workflow-events
      dead-letter: dead-letter
    topics:
      partitions: 1
      replicas: 1
  demo:
    activity-delay-ms: 60000

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
