spring:
  application:
    name: fuseflow-worker-registry

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fuseflow?currentSchema=registry}
    username: ${SPRING_DATASOURCE_USERNAME:fuseflow}
    password: ${SPRING_DATASOURCE_PASSWORD:fuseflow}

  flyway:
    enabled: true
    create-schemas: true
    schemas: registry
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

# Phase 3 worker-health tuning: heartbeats keep a worker ONLINE; after degraded-after without a
# heartbeat it is DEGRADED, after timeout (≈ N missed heartbeats) it is OFFLINE. The cleanup job
# purges the heartbeat log older than retention and removes workers OFFLINE beyond the grace period.
fuseflow:
  registry:
    detection:
      interval: 5s
    heartbeat:
      degraded-after: 15s
      timeout: 30s
      retention: 24h
      offline-removal-after: 7d

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
