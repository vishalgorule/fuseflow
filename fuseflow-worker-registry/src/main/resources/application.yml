spring:
  application:
    name: fuseflow-worker-registry

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fuseflow?currentSchema=registry}
    username: ${SPRING_DATASOURCE_USERNAME:fuseflow}
    password: ${SPRING_DATASOURCE_PASSWORD:fuseflow}

  flyway:
    enabled: true
    create-schemas: true
    schemas: registry
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
