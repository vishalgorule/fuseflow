spring:
  application:
    name: fuseflow-sample-workers

# The Kafka transport is fully owned by the SDK and needs no configuration here: serializers,
# offsets and internal topic names are SDK internals, and the broker address is discovered from
# the registry (GET /api/v1/config) — discovery waits for the registry, retrying every 5s, with
# no fallback. The only endpoint a worker declares is the registry below.
fuseflow:
  worker:
    enabled: true
    # Stable identity across restarts — the registry upserts on the client-supplied id.
    id: ${FUSEFLOW_WORKER_ID:22220000-0000-0000-0000-000000000001}
    host: ${FUSEFLOW_WORKER_HOST:localhost}
    heartbeat-interval: 5s
    # Phase 5: the pool this worker joins. Instances of the same pool share its dispatch
    # queue (fuseflow-pool.<pool>) and consumer group for parallelism; different pools are
    # routed to independently.
    pool: ${FUSEFLOW_WORKER_POOL:fuseflow-workers}
    # Pool-level declared parallelism — drives the pool queue's partition count (Phase 5).
    concurrency: ${FUSEFLOW_WORKER_CONCURRENCY:4}
    register-retries: 10
    register-retry-delay: 2s
  # Phase 6: annotation-defined workflows, both self-contained (@Activity methods are the
  # steps). On by default — ImageProcessingWorkflow and OrderFulfillmentWorkflow are
  # scanned, validated and registered with the definition service at boot.
  workflow:
    enabled: true
    register-retries: 10
    register-retry-delay: 2s
  definition:
    base-url: ${FUSEFLOW_DEFINITION_URL:http://localhost:8081}
  # Workflow-level enable flags (Phase 6): a fleet instance advertises/executes the whole
  # workflow's activities or none of them — heterogeneity is expressed per workflow, not per
  # activity (the io pool runs image-processing; the media pool runs order-fulfillment).
  # Default all-on — `make workers` is unchanged.
  sample:
    enable-image: ${FUSEFLOW_SAMPLE_ENABLE_IMAGE:true}
    enable-order: ${FUSEFLOW_SAMPLE_ENABLE_ORDER:true}
  registry:
    base-url: ${FUSEFLOW_REGISTRY_URL:http://localhost:8083}

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
